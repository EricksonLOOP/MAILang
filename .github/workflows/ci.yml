name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  dotnet-test:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Mail.slnx
        working-directory: MAILang

      - name: Build
        run: dotnet build Mail.slnx --no-restore -c Release
        working-directory: MAILang

      - name: Test
        run: dotnet test Mail.slnx --no-build -c Release
        working-directory: MAILang

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .
        working-directory: MAILang/sdk/python
