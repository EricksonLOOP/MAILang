[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-runtime"
version = "0.2.0"
description = "Python SDK for the MAIL agent orchestration runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.package-data]
mail_runtime = ["_bin/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
